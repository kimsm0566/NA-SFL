method: na_sfl_v4_residual
aux_client_count: 0
slow_client_ids: [0, 5]
rounds: 2
server_policy: individual
target_accuracy: 70
client_compute_seconds: {forward: 0.3, backward: 0.6, auxiliary: 0}
prototype:
  fast_sd_weight: 0.5
  fast_proto_weight: 0.5
  slow_proto_weight: 1.0
  alignment_weight_beta: 0.1
  alignment_reduction: mse
v4:
  enabled: true
  pseudo_loss_weight_gamma: 0.25
  pseudo_gradient_to_client: true
  pseudo_samples_per_class: 4
  min_residuals_per_class: 2
  max_residuals_per_class: 64
  residual_source: previous_completed_round
  residual_recenter: true
  residual_scale: 1.0
  residual_store_dtype: float32
  fallback_when_missing: proto_only
network:
  type: mininet
  slow_client_ids: [0, 5]
  fast_uplink_mbps: 100
  fast_downlink_mbps: 100
  slow_uplink_mbps: 20
  slow_downlink_mbps: 50
  rtt_ms: 10
  send_buffer_sd: 1
result_path: results/na_sfl_v3v4
