# Same four-way comparison with independent per-round, per-Client UL/DL draws.
method: na_sfl_v1
aux_client_count: 2
server_policy: individual
server_max_batch_samples: 512
rounds: 100
client_compute_seconds:
  forward: 0.3
  backward: 0.6
  auxiliary: 0.1
network:
  type: mininet
  slow_client_ids: [0, 5]
  fast_uplink_mbps: 100
  fast_downlink_mbps: 100
  slow_uplink_mbps: 20
  slow_downlink_mbps: 50
  rtt_ms: 10
  send_buffer_sd: 3
  round_rate_variation: 0.1
  rate_seed: 42
result_path: results/na_sfl_network_variable
